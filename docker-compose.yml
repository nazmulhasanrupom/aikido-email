# AIKIDO EMAIL: production stack (the app + Postgres). Works in Coolify and on any Docker server.
#
#   Coolify:  New resource > Docker Compose > point it at this repo. Set the variables below in the
#             Environment tab. Give the "app" service your domain, port 8080. Coolify's proxy makes HTTPS.
#   Other:    cp .env.production.example .env   (fill it in)   then   docker compose up -d --build
#             Put a reverse proxy with HTTPS in front (Caddy, Nginx, Traefik). The login needs HTTPS.
#
# Needed:   POSTGRES_PASSWORD, AIKIDO_PUBLIC_URL, AIKIDO_ENCRYPTION_KEY   (see .env.production.example)
# Health:   GET /health on the app answers {"status":"ok"} when the database works.
# Back up:  the "aikido_data" volume (it holds the encryption key) and the "pgdata" volume.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: aikido-email:latest
    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    # Only the proxy needs to reach the app, so the port is not published.
    # On a plain server without a proxy network, use:  ports: ["127.0.0.1:8080:8080"]
    expose:
      - "8080"
    environment:
      - DATABASE_URL=postgres://aikido:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/aikido
      - AIKIDO_PUBLIC_URL=${AIKIDO_PUBLIC_URL:?Set AIKIDO_PUBLIC_URL, for example https://mail.example.com}
      - AIKIDO_ENCRYPTION_KEY=${AIKIDO_ENCRYPTION_KEY:?Set AIKIDO_ENCRYPTION_KEY, made with openssl rand -base64 32}
      - AIKIDO_DATA_DIR=/data
      - AIKIDO_BIND_ADDR=0.0.0.0:8080
      # The proxy (Coolify's Traefik, Caddy, Nginx) sends the real client address in X-Forwarded-For.
      - AIKIDO_TRUST_PROXY=${AIKIDO_TRUST_PROXY:-true}
      - AIKIDO_DRY_RUN=${AIKIDO_DRY_RUN:-false}
      - RUST_LOG=${RUST_LOG:-info}
      # ---- optional: they show in the Coolify Environment tab; empty means not used ----
      # Google and Microsoft login for connecting inboxes (see README.md)
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - MS_CLIENT_ID=${MS_CLIENT_ID:-}
      - MS_CLIENT_SECRET=${MS_CLIENT_SECRET:-}
      - MS_TENANT=${MS_TENANT:-common}
      # Your own API keys (the server makes none by itself; make a master key in the app: Settings -> API)
      - AIKIDO_ADMIN_API_KEY=${AIKIDO_ADMIN_API_KEY:-}
      - AIKIDO_ACCOUNTS_API_KEY=${AIKIDO_ACCOUNTS_API_KEY:-}
      - AIKIDO_SENDING_API_KEY=${AIKIDO_SENDING_API_KEY:-}
      - AIKIDO_REPLIES_API_KEY=${AIKIDO_REPLIES_API_KEY:-}
      - AIKIDO_FOLLOWUPS_API_KEY=${AIKIDO_FOLLOWUPS_API_KEY:-}
      - AIKIDO_LEADS_API_KEY=${AIKIDO_LEADS_API_KEY:-}
      - AIKIDO_CAMPAIGNS_API_KEY=${AIKIDO_CAMPAIGNS_API_KEY:-}
      - AIKIDO_GENERATOR_API_KEY=${AIKIDO_GENERATOR_API_KEY:-}
      # Open tracking (README.md, "Open tracking"). To let the server get the certificates itself, publish the two ports
      # (for example "443:8443" and "80:8081" under `ports:`) and set the two addresses below.
      - AIKIDO_TRACKING_CNAME_TARGET=${AIKIDO_TRACKING_CNAME_TARGET:-}
      - AIKIDO_TRACKING_HTTPS_ADDR=${AIKIDO_TRACKING_HTTPS_ADDR:-}
      - AIKIDO_TRACKING_HTTP_ADDR=${AIKIDO_TRACKING_HTTP_ADDR:-}
      - AIKIDO_ACME_DIRECTORY=${AIKIDO_ACME_DIRECTORY:-}
      - AIKIDO_ACME_EMAIL=${AIKIDO_ACME_EMAIL:-}
      - AIKIDO_TRACKING_API_KEY=${AIKIDO_TRACKING_API_KEY:-}
      - AIKIDO_AUTOMATIONS_API_KEY=${AIKIDO_AUTOMATIONS_API_KEY:-}
      # Engine speed and switches (empty means the default)
      - AIKIDO_SCHEDULER_TICK_SECS=${AIKIDO_SCHEDULER_TICK_SECS:-}
      - AIKIDO_MAX_PARALLEL_ACCOUNTS=${AIKIDO_MAX_PARALLEL_ACCOUNTS:-}
      - AIKIDO_REPLY_TICK_SECS=${AIKIDO_REPLY_TICK_SECS:-}
      - AIKIDO_MAX_PARALLEL_SYNCS=${AIKIDO_MAX_PARALLEL_SYNCS:-}
      - AIKIDO_MAX_MESSAGE_BYTES=${AIKIDO_MAX_MESSAGE_BYTES:-}
      - AIKIDO_REPLY_CHECK_ENABLED=${AIKIDO_REPLY_CHECK_ENABLED:-}
      - AIKIDO_FOLLOWUPS_ENABLED=${AIKIDO_FOLLOWUPS_ENABLED:-}
      - AIKIDO_LEADS_ENABLED=${AIKIDO_LEADS_ENABLED:-}
      - AIKIDO_GENERATOR_ENABLED=${AIKIDO_GENERATOR_ENABLED:-}
    volumes:
      - aikido_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: aikido
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: aikido
    # Not published: only the app reaches the database, over the private network.
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aikido -d aikido"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  aikido_data:
  pgdata:
