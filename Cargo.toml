[package]
name = "aikido_email"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[features]
# `ui` embeds the web app from ui/dist into the binary. `--no-default-features` builds an API-only server.
default = ["ui"]
ui = ["dep:rust-embed"]

[dependencies]
tokio = { version = "1.53.2", features = ["full"] }
oauth2 = { version = "5.0.0", default-features = false, features = ["reqwest", "rustls-tls"] }
reqwest = {version = "0.13.5"}
serde_json = "1.0.154"
dotenvy = "0.15.7"
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls", "rustls-tls", "ring", "webpki-roots"] }
async-imap = { version = "0.12.0", default-features = false, features = ["runtime-tokio"] }
tokio-rustls = "0.26.6"
rustls-pki-types = "1.15.1"
webpki-roots = "1.0.9"
rpassword = "7.5.4"
aes-gcm = "0.10"
base64 = "0.22"
serde = { version = "1.0.229", features = ["derive"] }
futures = "0.3.34"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
axum = { version = "0.8.9", features = ["macros", "multipart"] }
tower-http = { version = "0.7.1", features = ["cors", "trace", "timeout"] }
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10.4"
croner = "=4.0.1"
uuid = { version = "1.28.0", features = ["v7", "serde"] }
rand = "0.8"
subtle = "2.6.1"
sha2 = "0.11.1"
secrecy = { version = "0.10.3", features = ["serde"] }
zeroize = { version = "1.9.1", features = ["derive"] }
thiserror = "2.0.21"
anyhow = "1.0.104"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
async-trait = "0.1.92"
tokio-util = "0.7.20"
utoipa-axum = "0.3.0"
utoipa = { version = "6.0.0", features = ["chrono", "uuid"] }
utoipa-scalar = { version = "0.4.0", features = ["axum"] }
mail-parser = "0.11.9"
html2text = "0.17.3"
regex = "1.13.1"
csv = "1.4.0"
hickory-resolver = "0.26.3"
argon2 = "0.5.3"
hkdf = "0.13.0"
hmac = "0.13.0"
zxcvbn = "3.1.1"
unicode-normalization = "0.1.26"
rust-embed = { version = "8.13.0", features = ["mime-guess", "debug-embed"], optional = true }
zip = { version = "2", default-features = false, features = ["deflate"] }
lopdf = "0.45.0"
ab_glyph = "0.2.32"
png = "0.18.1"
instant-acme = { version = "0.8.5", default-features = false, features = ["ring", "hyper-rustls", "rcgen"] }
x509-parser = "0.18.1"
pem = "4.0.0"
minijinja = { version = "=2.24.0", features = ["custom_syntax", "json", "fuel", "builtins", "multi_template"] }
schemars = { version = "=1.2.2", features = ["uuid1", "chrono04"] }
md-5 = "0.11.0"
jsonschema = { version = "=0.58.6", default-features = false }
flate2 = "1.1.10"
# The JavaScript engine of the code node (`code.js`). Pinned: the newest releases are too young to trust.
rquickjs = { version = "=0.12.2" }
# `util` gives `ServiceExt::oneshot`: automation nodes call the app router in-process.
tower = { version = "0.5.3", features = ["util"] }

[dev-dependencies]
# paused clocks in the AI Agent timeout test
tokio = { version = "1.53.2", features = ["test-util"] }

# Password hashing and the like are slow in an unoptimized build. Keep them fast in tests.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
[profile.dev.package.zxcvbn]
opt-level = 3

[profile.dev]
debug = "line-tables-only"
